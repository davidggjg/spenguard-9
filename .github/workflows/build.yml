name: Build SPENguard

on:
  push:
    branches: [ main, master, 'claude/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # packages: '' - the action's default tries to install the long-removed
      # "tools" package and fails. With licences accepted, the Android Gradle
      # Plugin downloads the platform and build-tools it needs by itself.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ── Signing ────────────────────────────────────────────────────────
      # The release keystore is provided through repository secrets and is
      # never stored in git. If the secrets are absent the release steps are
      # skipped instead of producing a broken, unsigned "release".
      - name: Decode release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "No KEYSTORE_BASE64 secret configured - release artifacts will be skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "${KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/spenguard-release.keystore"
            if [ ! -s "${GITHUB_WORKSPACE}/spenguard-release.keystore" ]; then
              echo "::error::KEYSTORE_BASE64 did not decode to a usable keystore file."
              exit 1
            fi
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate signing secrets
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "${KEYSTORE_PASSWORD}" ] && missing="${missing} KEYSTORE_PASSWORD"
          [ -z "${KEY_ALIAS}" ]         && missing="${missing} KEY_ALIAS"
          [ -z "${KEY_PASSWORD}" ]      && missing="${missing} KEY_PASSWORD"
          if [ -n "${missing}" ]; then
            echo "::error::KEYSTORE_BASE64 is set but these secrets are missing:${missing}"
            exit 1
          fi

      # ── Checks ─────────────────────────────────────────────────────────
      - name: Gradle clean
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      # ── Debug APK ──────────────────────────────────────────────────────
      - name: Build Debug APK
        run: ./gradlew packageDebugApk --no-daemon --stacktrace

      - name: Verify Debug APK exists
        run: |
          APK="app/build/outputs/dist/SPENguard-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK was not produced at $APK"
            ls -R app/build/outputs || true
            exit 1
          fi
          echo "Debug APK: $(du -h "$APK" | cut -f1)"

      # ── Release APK + AAB ──────────────────────────────────────────────
      - name: Build Release APK
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/spenguard-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew packageReleaseApk --no-daemon --stacktrace

      - name: Build Release AAB
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/spenguard-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew packageReleaseBundle --no-daemon --stacktrace

      - name: Verify release artifacts and signatures
        if: steps.signing.outputs.available == 'true'
        run: |
          set -e
          APK="app/build/outputs/dist/SPENguard-release.apk"
          AAB="app/build/outputs/dist/SPENguard-release.aab"
          for f in "$APK" "$AAB"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected artifact missing: $f"
              ls -R app/build/outputs || true
              exit 1
            fi
            echo "$f -> $(du -h "$f" | cut -f1)"
          done

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BUILD_TOOLS"

          echo "--- APK signature ---"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          echo "--- AAB signature ---"
          # An .aab is a jar; jarsigner verifies the v1/JAR signature on it.
          jarsigner -verify -verbose:summary "$AAB" | tail -20

          echo "--- 64-bit / ABI check ---"
          # Pure-Java app: it must contain no native libraries at all, which
          # satisfies the Google Play 64-bit requirement by definition.
          if unzip -l "$APK" | grep -q 'lib/'; then
            unzip -l "$APK" | grep 'lib/'
            if unzip -l "$APK" | grep 'lib/' | grep -qv 'arm64-v8a\|x86_64'; then
              echo "::error::32-bit-only native libraries found."
              exit 1
            fi
          else
            echo "No native libraries - 64-bit requirement satisfied."
          fi

      # ── Artifacts ──────────────────────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SPENguard-debug-apk-${{ github.run_number }}
          path: app/build/outputs/dist/SPENguard-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SPENguard-release-apk-${{ github.run_number }}
          path: app/build/outputs/dist/SPENguard-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release AAB (Google Play)
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SPENguard-release-aab-${{ github.run_number }}
          path: app/build/outputs/dist/SPENguard-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPENguard-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          {
            echo "## SPENguard build #${{ github.run_number }}"
            echo ""
            if [ -f app/build/outputs/dist/SPENguard-debug.apk ]; then
              echo "- ✅ Debug APK — $(du -h app/build/outputs/dist/SPENguard-debug.apk | cut -f1)"
            else
              echo "- ❌ Debug APK — not produced"
            fi
            if [ "${{ steps.signing.outputs.available }}" != "true" ]; then
              echo "- ⏭️ Release APK / AAB — skipped (no signing secrets configured)"
            else
              if [ -f app/build/outputs/dist/SPENguard-release.apk ]; then
                echo "- ✅ Release APK (signed) — $(du -h app/build/outputs/dist/SPENguard-release.apk | cut -f1)"
              else
                echo "- ❌ Release APK — not produced"
              fi
              if [ -f app/build/outputs/dist/SPENguard-release.aab ]; then
                echo "- ✅ Release AAB (signed) — $(du -h app/build/outputs/dist/SPENguard-release.aab | cut -f1)"
              else
                echo "- ❌ Release AAB — not produced"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
