name: Deploy website

# Publishes docs/ to GitHub Pages.
#
# This workflow is only needed if Pages is set to the "GitHub Actions"
# source. If Pages is set to "Deploy from a branch" (main, /docs) - the
# simpler option - GitHub publishes the site on its own and this workflow
# can be ignored.
#
# It is manual-only on purpose: a repository with Pages disabled, or with
# Pages set to the branch source, would otherwise fail this job on every
# push to docs/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pages must already be enabled, with its source set to
      # "GitHub Actions". The workflow token is not permitted to create a
      # Pages site, so enablement cannot be automated here.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Check the pages the site needs are present
        run: |
          set -e
          for f in index.html privacy.html download.html support.html \
                   sitemap.xml robots.txt assets/style.css assets/lang.js; do
            if [ ! -f "docs/$f" ]; then
              echo "::error::docs/$f is missing"
              exit 1
            fi
          done
          echo "All required pages present."

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report the live URL
        run: |
          {
            echo "## Website deployed"
            echo ""
            echo "- Site: ${{ steps.deployment.outputs.page_url }}"
            echo "- **Privacy policy (for Play Console): ${{ steps.deployment.outputs.page_url }}privacy.html**"
          } >> "$GITHUB_STEP_SUMMARY"
