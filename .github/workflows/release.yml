name: Publish release

# Creates a GitHub Release with the signed APK and AAB attached, so the
# download links on the website resolve. Trigger it by pushing a tag:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 is not configured - a release cannot be signed."
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 -d > "${GITHUB_WORKSPACE}/spenguard-release.keystore"
          test -s "${GITHUB_WORKSPACE}/spenguard-release.keystore"

      - name: Build signed APK and AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/spenguard-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew clean spenguardReleaseApk spenguardReleaseAab --no-daemon --stacktrace

      - name: Verify artifacts are present and signed
        run: |
          set -e
          APK="app/build/outputs/dist/SPENguard-release.apk"
          AAB="app/build/outputs/dist/SPENguard-release.aab"
          for f in "$APK" "$AAB"; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: SPENguard ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/dist/SPENguard-release.apk
            app/build/outputs/dist/SPENguard-release.aab
